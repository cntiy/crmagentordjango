version: '3.8'

services:
  web:
    build: .
    container_name: crm_lead_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      gunicorn crm_lead.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 60
      --access-logfile -
      --error-logfile -
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    networks:
      - pyq_mysql_prod_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"

networks:
  pyq_mysql_prod_default:
    external: true
